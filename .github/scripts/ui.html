<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#eee; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
#header { background:#16213e; padding:15px 20px; font-size:18px; font-weight:bold; color:#0f9; border-bottom:1px solid #333; }
#badge { font-size:12px; color:#aaa; margin-top:3px; }
#chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:12px 16px; border-radius:18px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.user { background:#0f3460; align-self:flex-end; border-radius:18px 18px 4px 18px; }
.bot { background:#16213e; align-self:flex-start; border-radius:18px 18px 18px 4px; border:1px solid #333; }
#inputarea { background:#16213e; padding:15px; border-top:1px solid #333; display:flex; gap:10px; }
#input { flex:1; background:#0d0d1a; border:1px solid #444; border-radius:25px; padding:12px 20px; color:#eee; font-size:15px; outline:none; }
#input:focus { border-color:#0f9; }
#send { background:#0f9; color:#000; border:none; border-radius:25px; padding:12px 25px; font-weight:bold; cursor:pointer; font-size:15px; }
</style>
</head>
<body>
<div id="header">🤖 Ollama Chat
  <div id="badge">gemma4:e4b</div>
</div>
<div id="chat"></div>
<div id="inputarea">
  <input id="input" placeholder="Message লিখুন..." onkeydown="if(event.key==='Enter')send()"/>
  <button id="send" onclick="send()">➤</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const history = [];

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  history.push({role:'user', content:text});
  const botDiv = addMsg('⏳', 'bot');
  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'gemma4:e4b', messages:history, stream:true})
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let full = '';
    botDiv.textContent = '';
    while(true) {
      const {done, value} = await reader.read();
      if (done) break;
      dec.decode(value).split('\n').filter(l=>l.trim()).forEach(line => {
        try {
          const d = JSON.parse(line);
          if (d.message?.content) {
            full += d.message.content;
            botDiv.textContent = full;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch(e) {}
      });
    }
    history.push({role:'assistant', content:full});
  } catch(e) {
    botDiv.textContent = 'Error: ' + e.message;
  }
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
</script>
</body>
</html>
