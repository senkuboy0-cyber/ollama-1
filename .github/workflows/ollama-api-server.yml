name: Ollama API Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          OLLAMA_ORIGINS="*" OLLAMA_HOST="0.0.0.0" ollama serve &
          sleep 5

      - name: Pull gemma4:e4b
        run: ollama pull gemma4:e4b

      - name: Install Cloudflared
        run: |
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Create Public URL
        run: |
          ssh -p 443 -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -R0:localhost:11434 \
            a.pinggy.io 2>&1 | tee /tmp/pinggy.log &
          sleep 10
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.a\.pinggy\.io' /tmp/pinggy.log | head -1)
          echo "================================"
          echo "Base URL: $URL/v1"
          echo "Model: gemma4:e4b"
          echo "================================"
          sleep 21600