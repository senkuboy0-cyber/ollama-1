name: Ollama Chat UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          OLLAMA_ORIGINS="*" OLLAMA_HOST="0.0.0.0" ollama serve &
          sleep 5

      - name: Pull gemma4:e4b
        run: ollama pull gemma4:e4b

      - name: Start Chat UI
        run: |
          cp .github/scripts/ui.html /tmp/ui.html
          python3 .github/scripts/server.py &
          sleep 3

      - name: Create Public URL
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -R 80:localhost:8080 \
            nokey@localhost.run 2>&1 | tee /tmp/lr.log &
          sleep 10
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.lhr\.life' /tmp/lr.log | head -1)
          echo "=============================="
          echo "  Chat UI: $URL"
          echo "=============================="
          sleep 21600