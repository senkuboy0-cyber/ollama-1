name: Ollama Open WebUI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          OLLAMA_ORIGINS="*" OLLAMA_HOST="0.0.0.0" ollama serve &
          sleep 5

      - name: Pull gemma4:e4b
        run: ollama pull gemma4:e4b

      - name: Install Open WebUI
        run: pip install open-webui --break-system-packages

      - name: Start Open WebUI
        run: |
          OLLAMA_BASE_URL=http://localhost:11434 \
          open-webui serve --port 8080 &
          sleep 15

      - name: Create Public URL
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -R 80:localhost:8080 \
            nokey@localhost.run 2>&1 | tee /tmp/lr.log &
          sleep 10
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.lhr\.life' /tmp/lr.log | head -1)
          echo "=============================="
          echo "  Open WebUI: $URL"
          echo "=============================="
          sleep 21600
